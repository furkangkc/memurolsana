<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İletişim | KamuAlım</title>
  <meta name="description" content="KamuAlım iletişim bilgileri ve düzeltme talepleri." />
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#475569; --primary:#1d4ed8; --border:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 20px; }
    .nav { max-width:860px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:1.25rem; font-weight:800; color:var(--primary); text-decoration:none; }
    .back { font-size:0.9rem; color:var(--muted); text-decoration:none; font-weight:600; }
    main { max-width:860px; margin:32px auto; padding:0 20px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:32px; }
    h1 { font-size:1.75rem; margin-bottom:12px; }
    h2 { font-size:1.15rem; margin:22px 0 8px; color:var(--primary); }
    p, li { color:var(--muted); margin-bottom:12px; }
    ul { padding-left:20px; }
    label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:6px; }
    input, textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; margin-bottom:14px; font-family:inherit; }
    button { background:var(--primary); color:#fff; border:none; padding:11px 22px; border-radius:8px; font-weight:600; cursor:pointer; }
    footer { max-width:860px; margin:32px auto; padding:20px; border-top:1px solid var(--border); text-align:center; font-size:0.86rem; color:var(--muted); }
    footer a { color:var(--muted); text-decoration:none; margin:0 8px; }
  </style>
</head>
<body>
  <header><div class="nav"><a href="index.html" class="logo">KamuAlım</a><a href="index.html" class="back">← İlanlara Dön</a></div></header>
  <main><article class="card"><h1>İletişim</h1>
        <p>Öneri, düzeltme veya kaldırma talepleriniz için bize <strong>iletisim@siteadiniz.com</strong> adresinden ulaşabilirsiniz.</p>
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
          <label>Adınız Soyadınız</label><input type="text" name="ad" required />
          <label>E-posta</label><input type="email" name="email" required />
          <label>Mesajınız</label><textarea name="mesaj" rows="5" required></textarea>
          <button type="submit">Gönder</button>
        </form>
        <p><small>Uyarı: Bu form üzerinden iş başvurusu veya özgeçmiş kabul edilmez.</small></p></article></main>
  <footer>
    <p>© 2026 KamuAlım</p>
    <p style="margin-top:8px;">
      <a href="hakkimizda.html">Hakkımızda</a>
      <a href="iletisim.html">İletişim</a>
      <a href="gizlilik-politikasi.html">Gizlilik Politikası</a>
      <a href="sorumluluk-reddi.html">Sorumluluk Reddi</a>
    </p>
  </footer>
</body>
</html>
