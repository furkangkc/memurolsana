name: Kamu İlanlarını Güncelle

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek-ve-kaydet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Paketleri yükle
        run: pip install requests beautifulsoup4 google-genai pydantic

      - name: Scraper ve Gemini ayrıştırıcıyı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Yeni ilanları ve SEO sayfalarını kaydet
        run: |
          git config --local user.email "bot@kamualim.local"
          git config --local user.name "KamuAlim Bot"
          git add data/ilanlar.json ilanlar/ sitemap.xml
          git diff --staged --quiet || (git commit -m "Otomatik ilan güncellemesi" && git push)
